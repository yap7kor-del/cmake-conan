name: C++ Conan CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    environment: debug-logs-conan-cmake 
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Conan
        run: |
          pip install conan
      
      - name: Detect Conan profile
        run: |
          conan profile detect

      - name: Verify Debug Environment
        run: |
          echo "=== Verification ==="
          echo "CONAN_LOG_LEVEL is set to: $CONAN_LOG_LEVEL"
          echo "CMAKE_LOG_LEVEL is set to: $CMAKE_LOG_LEVEL"
          echo "====================="

      - name: Install dependencies
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release
      
      - name: Configure CMake
        run: |
          # This step uses CMAKE_LOG_LEVEL=DEBUG automatically to show how packages are found
          # here if we run cmake --preset conan-release and then cmake --build build --config Release, we will see the debug logs for package discovery
          # cmake -S . -B build \
          #   -DCMAKE_BUILD_TYPE=Release \
          #   -DCMAKE_TOOLCHAIN_FILE=build/generators/conan_toolchain.cmake
          cmake --preset conan-release
      
      - name: Build
        run: |
          cmake --build build --config Release --parallel $(nproc)
