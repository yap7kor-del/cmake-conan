name: C++ Conan CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@4

      - name: Install Conan
        run: |
          pip install conan
      
      - name: Detect Conan profile
        run: |
          conan profile detect
      
      # - name: Add company Conan remote
      #   run: |
      #     conan remote add company-artifactory \
      #       ${{ secrets.CONAN_REMOTE_URL }}
      
      # - name: Login to Artifactory
      #   run: |
      #     conan remote login company-artifactory \
      #       ${{ secrets.CONAN_USERNAME }}\
      #       ${{ secrets.CONAN_PASSWORD}}

      - name: Install dependencies
        run: |
          conan install . \
            --build=missing \
            -s build_type=Release
      
      - name: Configure CMake
        run: |
          cmake --preset conan-release
      
      - name: Build
        run: |
          cmake --build build/Release
      
